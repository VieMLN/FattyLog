name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug is directly installable without keystore)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
  push:
    branches:
      - master
      - main
    paths:
      - 'fettylog/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './fettylog/package.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: ./fettylog
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Code
        working-directory: ./fettylog
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build Android APK
        working-directory: ./fettylog/android
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FettyLog-APK
          path: ./fettylog/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
